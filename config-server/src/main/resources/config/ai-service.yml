spring:
  mongodb:
    uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@cluster0.mqjwdt5.mongodb.net/AIService?retryWrites=true&w=majority
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: activity-processor-group
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fitness.aiservice.model.Activity
        spring.json.trusted.packages: "*"
kafka:
  topic:
    name: activity-events
server:
  port: 8083
eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}